[package]
name = "hyperblobs"
version = "0.1.0"
edition = "2021"

[dependencies]
derive_builder = "0.20.1"
futures-lite = "2.1.0"
thiserror = "1.0.63"
tracing = "0.1.40"
serde = { version = "1", features = ["derive"] }
hypercore_handshake = "0.6.0"
# TODO rm unused features
tokio = { version = "1.37.0", features = ["full"] }

[dev-dependencies]
rusty_nodejs_repl = { version = "0.4.0", features = ["integration_utils"] }
serde_json = "1"

[dependencies.hypercore]
version = "0.17.0-alpha.1"
default-features = false
features = ["sparse", "replication"]
